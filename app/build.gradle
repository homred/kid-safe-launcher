plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kidsafe.launcher'
    compileSdk 35

    defaultConfig {
        applicationId "com.kidsafe.launcher"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            testCoverageEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Note: The current build uses pure Android SDK (build.sh).
    // These AndroidX dependencies are included for future Gradle builds
    // when dl.google.com is accessible in the build environment.
    // The source code uses only android.* APIs and does not require these at runtime.

    testImplementation 'junit:junit:4.13.2'
}

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
